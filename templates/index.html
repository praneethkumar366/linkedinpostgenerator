<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Post Generator</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        h1, h2 {
            text-align: center;
            font-weight: 600;
            color: #ffffff;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea, input[type="file"] {
            padding: 12px;
            border-radius: 10px;
            border: none;
            resize: vertical;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
        }

        button {
            background: #00f2fe;
            color: black;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #03e9f4;
            transform: scale(1.05);
        }

        .image-preview img {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            border: 2px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .output {
            margin-top: 30px;
        }

        .output textarea {
            width: 100%;
            height: 150px;
            font-size: 16px;
            background-color: #f0f0f0;
            color: #000;
            padding: 10px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .output button {
            margin-top: 10px;
            background-color: #ffffff;
            color: #4a00e0;
            border: 2px solid #4a00e0;
        }

        .output button:hover {
            background-color: #4a00e0;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 LinkedIn Post Generator</h1>
        <form method="POST" enctype="multipart/form-data">
            <label for="achievement">Enter Your Achievement</label>
            <textarea name="achievement" placeholder="e.g. I got certified in Advanced Java from CodeTantra..." required></textarea>
            <label for="file">Or Upload Certificate</label>
            <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png">
            <button type="submit">Generate Post</button>
        </form>

        {% if image_url %}
        <div class="image-preview">
            <img src="{{ image_url }}" alt="Certificate Preview">
        </div>
        {% endif %}

        {% if result %}
        <div class="output">
            <h2>🎉 Generated Post:</h2>
            <textarea id="postOutput" readonly>{{ result }}</textarea>
            <button onclick="copyText()">📋 Copy to Clipboard</button>
        </div>
        {% endif %}
    </div>

    <script>
        function copyText() {
            const textArea = document.getElementById("postOutput");
            textArea.select();
            document.execCommand("copy");
            alert("Post copied to clipboard!");
        }
    </script>
</body>
</html>
